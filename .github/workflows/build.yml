name: Build

on:
  push:
    tags: ['*']
    paths-ignore:
      - README.md
  pull_request:
    branches: ["main", "feature/alpine"]
    paths-ignore:
      - README.md

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_PLATFORM: linux/amd64,linux/arm64

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: "{{defaultContext}}:.devcontainer"
          push: false
          tags: ${{ env.IMAGE_NAME }}:test
          provenance: false
          load: true

      - name: Compute image size
        run: |
          echo "Uncompressed image size: $(docker images "${{ env.IMAGE_NAME }}:test" --format "{{.Size}}")" > /tmp/image_size.txt 2>&1
          echo "Compressed image size: $(docker save "${{ env.IMAGE_NAME }}:test" | gzip -c | wc -c | numfmt --to=iec-i --suffix=B --format="%9.2f")" >> /tmp/image_size.txt 2>&1
          cat /tmp/image_size.txt

      - name: Save image
        run: docker save "${{ env.IMAGE_NAME }}:test" -o /tmp/test-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/test-image.tar
          retention-days: 1

      - name: Upload image size artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-size
          path: /tmp/image_size.txt
          retention-days: 1

  test-packages:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/test-image.tar

      - name: Test installed packages
        run: |
          cd test
          ./run_tests.sh "${{ env.IMAGE_NAME }}:test" packages
          cd ..

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: /tmp/test_result.txt
          retention-days: 1

  test-scripts:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/test-image.tar

      - name: Test custom scripts
        run: |
          cd test
          ./run_tests.sh "${{ env.IMAGE_NAME }}:test" scripts
          cd ..

  test-entrypoint:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/test-image.tar

      - name: Test entrypoint
        run: |
          cd test
          ./run_tests.sh "${{ env.IMAGE_NAME }}:test" entrypoint
          cd ..

  publish:
    needs: [test-packages, test-scripts, test-entrypoint]
    permissions:
      contents: write # for ncipollo/release-action to create release
      packages: write # for docker/build-push-action to store image to package
      pull-requests: write # for thollander/actions-comment-pull-request to comment on the PR
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare Meta Data
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Multi-arch build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: "{{defaultContext}}:.devcontainer"
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: ${{ env.IMAGE_PLATFORM }}
          provenance: false

      - name: Tag and create a GitHub release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.meta.outputs.version }}
          commit: ${{ github.sha }}
          name: ${{ steps.meta.outputs.version }}
          skipIfReleaseExists: true
          allowUpdates: false
          generateReleaseNotes: true
          prerelease: ${{ github.event_name == 'pull_request' }}

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-result
          path: /tmp

      - name: Download image size
        uses: actions/download-artifact@v4
        with:
          name: image-size
          path: /tmp

      - name: Generate tool version details
        run: |
          # Tool versions
          python3 version_parser.py /tmp/test_result.txt > /tmp/vnote.txt
          # Image size
          echo >> /tmp/vnote.txt
          cat /tmp/image_size.txt >> /tmp/vnote.txt
          # Final content
          cat /tmp/vnote.txt

      - name: Update release with tool version
        if: github.event_name != 'pull_request'
        uses: hugoheml/update_release@210697dd5e2b1831b4f4a12eb405dc13cae8fe15 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.version }}
        with:
          is_append_body: true
          body_path: /tmp/vnote.txt

      - name: Update PR with tool version
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          file-path: /tmp/vnote.txt
